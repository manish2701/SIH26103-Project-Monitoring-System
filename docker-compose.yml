services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sih26103-backend
    ports:
      - "8000:8000"
    volumes:
      - sih26103_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sih26103-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sih26103_data:
